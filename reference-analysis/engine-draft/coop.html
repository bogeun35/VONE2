<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>참치코드 · 참치파크</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071923;color:#e7f9f9;font:16px system-ui}button,input,select{font:inherit}select{max-width:100%;padding:12px 16px;border:2px solid #315360;border-radius:12px;background:#071923;color:#e7f9f9}select:focus-visible{outline:2px solid #ffd677;outline-offset:3px}.campaign{display:grid;gap:9px;margin:24px auto 12px;width:min(350px,100%)}.campaign label{color:#a3c1c8;font-size:14px}.campaign small{font-size:12px;letter-spacing:1px}.panel{max-height:96vh;overflow:auto}button{background:#123541;color:inherit;border:2px solid #315360;border-radius:14px;padding:15px 25px;cursor:pointer}button:hover,button:focus-visible{border-color:#ffd677;outline:none;transform:translateY(-2px)}button:disabled{opacity:.4}main{height:100vh;display:grid;place-items:center}.panel{text-align:center;background:#102c37;border:1px solid #315360;border-radius:28px;padding:40px;width:min(650px,95vw)}h1{font-size:56px;margin:12px}p{color:#a3c1c8}.row{display:flex;gap:12px;justify-content:center;margin:18px;flex-wrap:wrap}input{width:150px;padding:14px;border-radius:12px;background:#071923;color:white;border:2px solid #315360;text-transform:uppercase}canvas{width:100%;height:100%;object-fit:contain;background:#071923}#game{position:fixed;inset:0;display:none}#hud{position:absolute;left:20px;top:15px;display:flex;gap:18px;align-items:center}#overlay{position:absolute;inset:0;display:none;place-items:center;background:#07192399}#message{min-height:24px;color:#ffd677}.tag{background:#244853;border-radius:10px;padding:10px}small{color:#abc5cc}#help{display:none}</style>
<main><section class="panel" id="title"><small>CHAMCHICODE / CO-OP</small><h1>참치파크</h1><p>작은 참치들의 큰 협동</p><div class="campaign"><label for="localStage">출발 구역</label><select id="localStage" aria-label="둘이 연습 출발 구역"></select><small id="courseLabel"></small><small id="campaignProgress"></small></div><div class="row"><button id="local">🎮 둘이 연습</button><button id="create">🌐 방 만들기</button></div><div class="row"><input id="code" maxlength="5" placeholder="방 코드" aria-label="방 코드"><button id="join">참가</button></div><button id="helpButton">? 조작</button><p id="help">1P ← → / ↑ · 2P A D / W<br>R 다시 시작 · Esc 메뉴 · F 전체화면</p><p id="message" role="status"></p><a href="index.html" style="color:#a3c1c8">참치코드</a></section>
<section class="panel" id="lobby" hidden><small>참치파크 / 대기실</small><h1 id="roomCode"></h1><div id="members" class="row"></div><p id="lobbyHint"></p><small id="roomCourse"></small><div class="campaign"><label for="roomStage">출발 구역 · 방장 선택</label><select id="roomStage" aria-label="온라인 출발 구역"></select></div><div class="row"><button id="start">출발</button><button id="leave">나가기</button></div></section></main>
<section id="game"><canvas id="canvas" tabindex="-1" aria-label="참치파크 게임 화면" width="1200" height="675"></canvas><div id="hud"><span id="stage" class="tag"></span><span id="progress" class="tag"></span><button id="menu" style="padding:8px">☰</button><button id="mute" style="padding:8px" aria-label="소리 끄기">♪</button></div><div id="overlay"><div class="panel"><h1 id="result"></h1><p id="reason" role="status"></p><div class="row"><button id="continue">다시 도전</button><button id="exit">나가기</button></div></div></div></section>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script src="coop-audio.js"></script><script src="coop-rules.js"></script><script src="coop-engine.js"></script><script src="coop-network.js"></script><script src="coop-ui.js"></script></html>
