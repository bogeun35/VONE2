<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>참치파크 · 로컬 데모</title><style>
*{box-sizing:border-box}body{margin:0;background:#080f1c;color:#eafaff;font:16px system-ui}main{max-width:1240px;margin:0 auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between;padding:0 4px 18px}h1{font-size:22px;letter-spacing:2px;margin:0}small{font-size:12px;color:#91a6b9}.tag{color:#66e1d2;border:1px solid #245b60;padding:7px 12px;border-radius:20px;font-size:12px}canvas{display:block;width:min(100%, calc((100dvh - 180px) * 1.77778));margin:0 auto;height:auto;aspect-ratio:1200/675;background:#0e2233;border-radius:18px;border:1px solid #28435a;outline:none}footer{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;gap:14px;flex-wrap:wrap}kbd{display:inline-block;padding:5px 9px;background:#1c3449;border:1px solid #3a566d;border-bottom:3px solid #3a566d;border-radius:6px;font-size:13px}button{border:1px solid #47778d;background:#143044;color:white;padding:9px 16px;border-radius:9px;cursor:pointer}#message{color:#ffd58d;font-size:14px}a{color:#a4bccc}details{margin-top:10px;color:#98acbd;font-size:13px}summary{cursor:pointer}p{line-height:1.7}
#pause-panel[hidden]{display:none}#pause-panel{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#050d19c9;backdrop-filter:blur(7px)}.pause-card{width:min(390px,calc(100vw - 40px));padding:30px;background:#102738;border:1px solid #47778d;border-radius:22px;box-shadow:0 25px 100px #0008}.pause-card h2{margin:0 0 22px;font-size:25px}.pause-actions{display:grid;gap:12px}.pause-actions button{text-align:left;padding:15px 18px;font-size:18px;transition:background .12s}.pause-actions button:focus-visible,.pause-actions button[aria-current="true"]{outline:2px solid #7be6d5;outline-offset:3px;background:#24566a}.pause-keys{margin:22px 0 0;color:#9eb8c8;font-size:13px}.game-actions{display:flex;gap:8px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #7be6d5;outline-offset:4px}
</style><main id="game-screen"><header><div><h1>참치파크</h1><small>로컬 데모 · 검수 중</small></div><span class="tag" id="stage-tag"></span></header><canvas id="game" width="1200" height="675" tabindex="0" aria-label="참치파크 로컬 협동 데모"></canvas><footer><div><span id="selected-name">1번</span> <kbd>A</kbd> <kbd>D</kbd> <kbd>W</kbd> <span style="color:#57dacb">●</span> &nbsp; <kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <span style="color:#ffc37d">●</span></div><span id="message">함께 다리를 건너 승강기에 올라타세요.</span><div class="game-actions"><button id="next" hidden>다음 단계 <kbd>Enter</kbd></button><button id="pause">일시정지 <kbd>Esc</kbd></button><button id="reset">다시 시작 <kbd>R</kbd></button></div></footer><details><summary>조작 · 검수 범위</summary><p>숫자 1~8로 캐릭터 선택, A/D 이동, W 점프. 방향키로 2번도 동시에 조작할 수 있어요. 실제 온라인 접속은 지원하지 않는 로컬 데모입니다.</p><p id="scope">장치와 규칙을 조립한 데모입니다. 원작의 상세 배치·수치와 재미 검수는 진행 중입니다.</p></details></main>
<div id="pause-panel" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden><section class="pause-card"><h2 id="pause-title">잠시 쉬어가기</h2><div class="pause-actions"><button data-pause-action="continue">계속하기</button><button data-pause-action="restart">다시 시작</button><button data-pause-action="stages">스테이지 선택</button></div><p class="pause-keys">↑ ↓ 선택 &nbsp; · &nbsp; Enter 확인 &nbsp; · &nbsp; Esc 계속</p></section></div>
<script src="devices.js"></script><script src="stage1-1.js"></script><script src="demo-stages.js"></script><script src="mini-games.js"></script><script src="hazard-geometry.js"></script><script src="engine.js"></script><script src="camera.js"></script><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),keys=new Set(),colors=['#50dfd0','#ffbd79','#b7a1f2','#f291b0','#a7d872','#73b8ed','#f3da78','#d7e2e2'];
const params=new URLSearchParams(location.search),stageId=params.get('id')||'pico1/world/01-01',count=Math.max(2,Math.min(8,Math.floor(Number(params.get('count')))||2)),ids=Array.from({length:count},(_,i)=>'p'+(i+1));
const descriptor=(typeof ParkDemoStages.list==='function'?ParkDemoStages.list():ParkDemoStages.list||[]).find(d=>d.id===stageId);let selected=0;
let state,prev=performance.now(),acc=0,camera=null,paused=false,pauseIndex=0;
const pausePanel=document.getElementById('pause-panel'),gameScreen=document.getElementById('game-screen'),pauseButtons=Array.from(pausePanel.querySelectorAll('button'));
function clearInput(){keys.clear();acc=0;prev=performance.now();}
function selectPause(index){pauseIndex=Math.max(0,Math.min(pauseButtons.length-1,index));pauseButtons.forEach((b,i)=>b.setAttribute('aria-current',String(i===pauseIndex)));pauseButtons[pauseIndex].focus({preventScroll:true});}
function resume(){if(document.hidden)return;paused=false;pausePanel.hidden=true;gameScreen.inert=false;clearInput();canvas.focus({preventScroll:true});}
function pause(){if(!state||state.status!=='play'||paused)return;paused=true;clearInput();gameScreen.inert=true;pausePanel.hidden=false;selectPause(0);}
function returnToStages(){clearInput();location.href='../campaign/#stages';}
function reset(){state=ParkRebuild.create(ids,{map:ParkDemoStages.createStage(stageId,count)});document.getElementById('stage-tag').textContent=(descriptor?.title||stageId)+' / '+count+'인';camera=null;paused=false;pausePanel.hidden=true;gameScreen.inert=false;clearInput();if(document.hidden)pause();else canvas.focus({preventScroll:true});}
function nextStage(){const all=typeof ParkDemoStages.list==='function'?ParkDemoStages.list():ParkDemoStages.list||[],at=all.findIndex(d=>d.id===stageId),next=all.slice(at+1).find(d=>d.playable||globalThis.ParkMiniGames?.supports(d.id));if(next)location.href=(globalThis.ParkMiniGames?.supports(next.id)?'mini.html':'index.html')+'?id='+encodeURIComponent(next.id)+'&count='+count+'&from=menu';else returnToStages();}
function activatePause(){const action=pauseButtons[pauseIndex].dataset.pauseAction;if(action==='continue')resume();else if(action==='restart')reset();else returnToStages();}
pauseButtons.forEach((button,i)=>{button.addEventListener('focus',()=>{pauseIndex=i;pauseButtons.forEach((b,j)=>b.setAttribute('aria-current',String(i===j)));});button.addEventListener('click',()=>{pauseIndex=i;activatePause();});});
document.getElementById('reset').onclick=reset;document.getElementById('next').onclick=nextStage;
document.getElementById('pause').onclick=()=>state.status==='play'?pause():returnToStages();
addEventListener('keydown',e=>{
 if(!state||e.altKey||e.ctrlKey||e.metaKey)return;
 if(e.code==='KeyF'){e.preventDefault();if(!e.repeat){const action=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();action?.catch(()=>{});}return;}
 if(!paused&&/^Digit[1-8]$/.test(e.code)){e.preventDefault();selected=Math.min(count-1,Number(e.code.slice(-1))-1);clearInput();return;}
 if(paused){
  if(['ArrowUp','ArrowDown','Tab','Enter','NumpadEnter','Escape','Backspace','Space'].includes(e.code))e.preventDefault();
  if(e.repeat)return;
  if(e.code==='ArrowUp')selectPause(pauseIndex===0?pauseButtons.length-1:pauseIndex-1);
  else if(e.code==='ArrowDown')selectPause(pauseIndex===pauseButtons.length-1?0:pauseIndex+1);
  else if(e.code==='Tab')selectPause((pauseIndex+(e.shiftKey?-1:1)+pauseButtons.length)%pauseButtons.length);
  else if(['Enter','NumpadEnter','Space'].includes(e.code))activatePause();
  else if(['Escape','Backspace'].includes(e.code))resume();
  return;
 }
 if(['Escape','Backspace'].includes(e.code)){e.preventDefault();if(!e.repeat){if(state.status==='play')pause();else returnToStages();}return;}
 if(e.target instanceof HTMLButtonElement&&['Space','Enter','NumpadEnter'].includes(e.code))return;
 if(state.status!=='play'&&['Enter','NumpadEnter'].includes(e.code)){e.preventDefault();if(!e.repeat){if(state.status==='clear')nextStage();else reset();}return;}
 if(['KeyA','KeyD','KeyW','ArrowLeft','ArrowRight','ArrowUp','KeyR','Space'].includes(e.code)){e.preventDefault();keys.add(e.code);if(e.code==='KeyR'&&!e.repeat)reset();}
});
addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{clearInput();pause();});
document.addEventListener('visibilitychange',()=>{clearInput();if(document.hidden)pause();});
function box(x,y,w,h,fill,r=4){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function draw(){const m=state.map;ctx.clearRect(0,0,1200,675);const gradient=ctx.createLinearGradient(0,0,0,675);gradient.addColorStop(0,'#091622');gradient.addColorStop(1,'#173f50');ctx.fillStyle=gradient;ctx.fillRect(0,0,1200,675);
camera=ParkCamera.update(camera,state.players,m,{width:1200,height:675},1/60);
ctx.save();ctx.scale(camera.zoom,camera.zoom);ctx.translate(-camera.x,-camera.y);ctx.strokeStyle='#193a49';ctx.lineWidth=1;for(let x=0;x<(m.width||1200);x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,675);ctx.stroke();}
for(const c of m.crates||[]){box(c.x,c.y,c.w,c.h,'#c89761');ctx.strokeStyle='#72573f';ctx.lineWidth=3;ctx.strokeRect(c.x+5,c.y+5,c.w-10,c.h-10);}
for(const spring of m.springs||[]){box(spring.x,spring.y,spring.w,spring.h,'#a995e8');ctx.strokeStyle='#ded5ff';ctx.beginPath();ctx.moveTo(spring.x,spring.y+spring.h);ctx.lineTo(spring.x+spring.w/3,spring.y);ctx.lineTo(spring.x+spring.w*2/3,spring.y+spring.h);ctx.lineTo(spring.x+spring.w,spring.y);ctx.stroke();}
for(const p of [...m.platforms,...(m.movingPlatforms||[])]){box(p.x,p.y,p.w,p.h,'#264e5e');box(p.x,p.y,p.w,5,'#6ba5a8',2);}
for(const d of m.devices||[]){if(d.kind==='bridge'){if(d.active){box(d.x,d.y,d.w,d.h,'#4dd5bd');ctx.strokeStyle='#c9fff0';ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+d.w,d.y);ctx.stroke();}else{ctx.strokeStyle='#42786d';ctx.setLineDash([8,10]);ctx.strokeRect(d.x,d.y,d.w,d.h);ctx.setLineDash([]);}}else if(d.kind==='lift'){box(d.x,d.y,d.w,d.h,'#eeae64');}else if(d.kind==='gate'&&!d.active)box(d.x,d.y,d.w,d.h,'#8ca5bd');}
for(const b of m.switches||[]){box(b.x,b.y,b.w,b.h||7,'#fb868e');ctx.strokeStyle='#fdc2c7';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x+b.w/2,b.y-13,6,0,Math.PI*2);ctx.stroke();}
const ex=m.exit;if(ex){box(ex.x,ex.y,ex.w,ex.h,state.keyTaken?'#5bbfa4':'#355666',12);ctx.strokeStyle=state.keyTaken?'#baffdf':'#7da2b0';ctx.lineWidth=3;ctx.strokeRect(ex.x+10,ex.y+12,ex.w-20,ex.h-12);ctx.fillStyle='#d9fff2';ctx.fillRect(ex.x+ex.w-19,ex.y+ex.h/2,4,4);}
if(!state.keyTaken&&m.key){const k=m.key;ctx.strokeStyle='#ffe294';ctx.lineWidth=5;ctx.beginPath();ctx.arc(k.x+k.w/2,k.y+7,7,0,Math.PI*2);ctx.moveTo(k.x+k.w/2,k.y+14);ctx.lineTo(k.x+k.w/2,k.y+k.h+7);ctx.lineTo(k.x+k.w/2+8,k.y+k.h+7);ctx.stroke();}
for(const h of m.hazards||[]){if(h.shape==='spike'){ctx.fillStyle='#ff8398';for(const t of ParkHazards.triangles(h)){ctx.beginPath();ctx.moveTo(t[0].x,t[0].y);ctx.lineTo(t[1].x,t[1].y);ctx.lineTo(t[2].x,t[2].y);ctx.closePath();ctx.fill();}}else{box(h.x,h.y,h.w,h.h,'#d45c78');ctx.strokeStyle='#ffb3ba';ctx.lineWidth=2;ctx.strokeRect(h.x+1,h.y+1,h.w-2,h.h-2);}}
for(const coin of m.coins||[]){if(coin.taken||coin.collected)continue;ctx.fillStyle='#ffd772';ctx.beginPath();ctx.arc(coin.x+(coin.w||18)/2,coin.y+(coin.h||18)/2,9,0,Math.PI*2);ctx.fill();}
if(m.rules?.ropeLength){const team=state.players.filter(p=>!p.exit);ctx.strokeStyle='#ead7a4';ctx.lineWidth=3;ctx.beginPath();team.forEach((p,i)=>{const x=p.x+p.w/2,y=p.y+p.h/2;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);});ctx.stroke();}
state.players.forEach((p,i)=>{if(p.exit)return;if(i===selected){ctx.strokeStyle='#ffffff';ctx.lineWidth=2/camera.zoom;ctx.strokeRect(p.x-4,p.y-4,p.w+8,p.h+8);}ctx.globalAlpha=p.exit?.6:1;box(p.x,p.y,p.w,p.h,colors[i%colors.length],9);ctx.fillStyle=colors[i%colors.length];ctx.beginPath();ctx.moveTo(p.x+4,p.y+14);ctx.lineTo(p.x-8,p.y+7);ctx.lineTo(p.x-8,p.y+29);ctx.lineTo(p.x+4,p.y+24);ctx.fill();ctx.fillStyle='#132c36';ctx.fillRect(p.x+p.w-12,p.y+12,5,6);ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillStyle='#eaffff';ctx.fillText(String(i+1),p.x+p.w/2,p.y-9);ctx.globalAlpha=1;});ctx.restore();
for(const d of m.devices.filter(d=>d.kind==='lift')){const riders=state.players.filter(p=>(d.occupantIds||[]).includes(p.id)&&!p.exit);const top=Math.min(d.y,...riders.map(p=>p.y));const spot=ParkCamera.point(camera,d.x+d.w/2,top);if(spot.x>=-40&&spot.x<=1240){const x=Math.max(45,Math.min(1155,spot.x)),y=Math.max(73,Math.min(621,spot.y-43));box(x-40,y,80,32,'#122c3fee',9);ctx.textAlign='center';ctx.fillStyle='#ffdc9b';ctx.font='bold 18px system-ui';ctx.fillText((d.occupancy||0)+' / '+d.requiredPlayers,x,y+23);}}
if(m.rules?.blackout){ctx.save();ctx.beginPath();ctx.rect(0,0,1200,675);for(const p of state.players.filter(p=>!p.exit)){const pos=ParkCamera.point(camera,p.x+p.w/2,p.y+p.h/2);ctx.moveTo(pos.x+100,pos.y);ctx.arc(pos.x,pos.y,100,0,Math.PI*2,true);}ctx.fillStyle='#02060cf5';ctx.fill('evenodd');ctx.restore();}
ctx.fillStyle='#b4d1dd';ctx.textAlign='left';ctx.font='bold 15px system-ui';ctx.fillText(descriptor?.title||'함께 건너기',28,38);ctx.textAlign='right';ctx.fillStyle=state.keyTaken?'#ffde94':'#718e9c';ctx.fillText(m.requiredCoins?'● '+(state.coinsTaken||0)+' / '+m.requiredCoins:state.keyTaken?'열쇠 ●':'열쇠 ○',1170,38);if(m.timeLimit){ctx.fillStyle='#ffdc9b';ctx.fillText(Math.max(0,Math.ceil(m.timeLimit-state.elapsed))+'초',1170,67);}if(m.rules?.trafficLight){box(555,18,90,34,state.trafficStop?'#ce5266':'#388f74',12);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(state.trafficStop?'멈춰!':'이동',600,41);}if(m.rules?.stamina){box(28,50,150,8,'#325566');box(28,50,150*Math.max(0,Math.min(1,state.stamina/m.rules.stamina.max)),8,'#ffe49a');}
if(state.status!=='play'){box(325,250,550,150,'#0a1725ee',20);ctx.textAlign='center';ctx.fillStyle='#f4fffe';ctx.font='bold 30px system-ui';ctx.fillText(state.status==='clear'?'함께 도착!':'다시, 함께',600,307);ctx.font='16px system-ui';ctx.fillStyle='#adc7d5';ctx.fillText(state.status==='clear'?'Enter 다음 단계  ·  R 다시 시작  ·  ⌫ 선택':'Enter 다시 시작  ·  ⌫ 스테이지 선택',600,353);}
document.getElementById('message').textContent=paused?'일시정지':state.status==='clear'?'함께 도착!':state.status==='dead'?'함께 다시 도전해요':state.keyTaken?'모두 출구로!':'함께 출구로!';document.getElementById('selected-name').textContent=(selected+1)+'번';
document.getElementById('next').hidden=state.status!=='clear';document.getElementById('pause').innerHTML=state.status==='play'?'일시정지 <kbd>Esc</kbd>':'스테이지 선택 <kbd>Esc</kbd>';
}
function loop(t){const elapsed=document.hidden||paused?0:Math.max(0,Math.min((t-prev)/1000,.08));prev=t;acc+=elapsed;while(!paused&&acc>=1/60){const inputs={};inputs[ids[selected]]={left:keys.has('KeyA')||(selected===1&&keys.has('ArrowLeft')),right:keys.has('KeyD')||(selected===1&&keys.has('ArrowRight')),jump:keys.has('KeyW')||(selected===1&&keys.has('ArrowUp'))};if(selected!==1)inputs.p2={left:keys.has('ArrowLeft'),right:keys.has('ArrowRight'),jump:keys.has('ArrowUp')};ParkRebuild.step(state,inputs,1/60);acc-=1/60;}draw();requestAnimationFrame(loop);}
try{if(!descriptor?.playable)throw Error('이 스테이지는 준비 중이에요.');reset();requestAnimationFrame(loop);}catch(error){document.getElementById('message').textContent=error.message;document.getElementById('pause').textContent='스테이지 선택';document.getElementById('pause').onclick=returnToStages;document.getElementById('reset').disabled=true;}
</script></html>
