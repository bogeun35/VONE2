<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>참치파크 · 함께하는 미니게임</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09131e;color:#eef8f5;font:16px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(1320px,100%);padding:22px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:14px}header{margin-bottom:14px}h1{font-size:23px;letter-spacing:-1px;margin:0}small{color:#93afbd}button{background:#1c3444;border:1px solid #3b5d6b;border-radius:10px;color:#edf8f5;padding:10px 16px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #7ce6c4;outline-offset:3px}canvas{display:block;width:100%;max-height:calc(100vh - 180px);aspect-ratio:1200/675;object-fit:contain;background:#102532;border:1px solid #345462;border-radius:18px}footer{margin-top:14px;font-size:13px;color:#adc3cc;flex-wrap:wrap}kbd{display:inline-block;background:#213e4c;border:1px solid #527079;border-radius:5px;padding:3px 6px;color:#edfff5;font:12px system-ui}.hud{display:flex;gap:14px;align-items:center}.hud strong{color:#8be4c6}dialog{background:#102633;color:#f1f8f5;border:1px solid #507b83;border-radius:22px;width:min(460px,90vw);padding:30px}dialog::backdrop{background:#041017d9;backdrop-filter:blur(6px)}dialog h2{font-size:28px;margin:0 0 16px}dialog p{line-height:1.8;color:#b9ced4}dialog button{width:100%;margin:6px 0}#pause-menu strong{display:block;color:#9ce6cb;margin:12px 0}.tag{border:1px solid #3b665f;padding:7px 12px;border-radius:30px;font-size:12px;color:#95dfc5}@media(max-width:600px){main{padding:10px}header{flex-wrap:wrap}h1{font-size:19px}canvas{max-height:none}footer{font-size:11px}.hud{font-size:12px}}
</style>
<main><header><div><h1 id="title">참치파크</h1><small id="subtitle">규칙 데모</small></div><div class="hud"><strong id="progress"></strong><span class="tag" id="population"></span><button id="help" aria-label="조작 도움말">?</button></div></header><canvas id="game" width="1200" height="675" tabindex="0" aria-label="참치파크 미니게임"></canvas><footer><span><kbd>1~8</kbd> 조작 전환 · <kbd>← →</kbd> 이동 · <kbd>Space</kbd> 동작</span><span id="mode-hint"></span><span><button id="pause">일시정지</button> <button id="fullscreen" aria-label="전체화면">⛶</button></span></footer></main>
<dialog id="pause-menu"><h2 id="result">잠깐 쉬어가기</h2><strong id="result-detail"></strong><button id="continue">계속하기</button><button id="next">다음 단계 →</button><button id="retry">다시 도전</button><button id="menu">스테이지 선택</button></dialog>
<dialog id="help-menu"><h2>함께 조작하기</h2><p id="help-copy"></p><p>각 사람의 색 아래에 표시된 키로 동시에 동작할 수 있어요. 숫자 키로 조작할 사람을 바꾸고 방향키로 움직이세요.</p><small>원작의 정확한 지형과 수치 대조 전인 로컬 데모입니다. 온라인 연결은 포함되지 않습니다.</small><button id="help-close">돌아가기</button></dialog>
<script src="stage1-1.js"></script><script src="demo-stages.js"></script><script src="mini-games.js"></script><script src="mini-ui.js"></script></html>
