<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>참치파크 · 원본 좌표 검수</title>
<link rel="stylesheet" href="atlas.css">
<body>
<header><strong>참치파크 <small>원본 좌표 검수 · 로컬 전용</small></strong><span id="status" role="status">불러오는 중…</span></header>
<nav aria-label="라운드 선택">
  <button id="prev" title="이전 라운드 · ←">←</button><select id="stage" aria-label="라운드"></select><button id="next" title="다음 라운드 · →">→</button>
  <label>인원 <select id="count" aria-label="인원"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label>
  <select id="mode" aria-label="보기 방식"><option value="auto">인원별 자동</option><option value="manual">원본 전체 · 수동</option></select>
  <label><input id="online" type="checkbox">온라인 구성</label>
  <label>변형 <select id="variant" aria-label="원본 변형"></select></label>
  <button id="fit" title="전체 좌표 보기 · F">전체 보기</button><button id="flip" title="Y축 방향 전환">Y↓</button>
  <label>종류 <select id="type" aria-label="오브젝트 종류"><option value="">전체</option></select></label>
  <label><input id="tiles" type="checkbox" checked>지형</label>
</nav>
<main><section class="viewport"><canvas id="map" aria-label="원본 오브젝트 좌표. 방향키로 라운드와 변형을 선택할 수 있습니다."></canvas><div id="hint">← → 라운드　↑ ↓ 수동 변형　[ ] 인원　휠 확대　드래그 이동　F 전체 보기</div></section>
<aside><h1 id="title">—</h1><p id="summary"></p><p id="geometry-note" class="notice"></p><label>오브젝트 <select id="actor" aria-label="오브젝트 선택"><option value="">선택</option></select></label><p class="notice">점의 위치는 원본 좌표입니다. 점 크기는 표시용이며 충돌 크기가 아닙니다. datas의 크기 해석은 아직 적용하지 않았습니다.</p><div id="detail" tabindex="0">점을 누르면 속성이 표시됩니다.</div><details><summary>변형 원본 설정</summary><pre id="settings"></pre></details></aside></main>
<script src="/population-rules.js"></script><script src="model.js"></script><script src="atlas.js"></script>
</body></html>
